<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>India Shortest Path Finder | Dijkstra Algorithm Visualizer</title>
  <meta name="description" content="An interactive visualization of Dijkstra's shortest path algorithm on a real highway network map of Indian cities, capitals, and Union Territories. Built with Leaflet.js.">
  <meta name="keywords" content="Dijkstra Algorithm, Shortest Path Finder, India Map, Leaflet JS, Graph Theory, Visualizer">
  
  <!-- Google Fonts (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet.js CSS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app-container">
    
    <!-- 1. MAP CANVAS CONTAINER -->
    <main id="map" aria-label="Interactive map of India showing cities and national highways"></main>

    <!-- 2. FLOATING CONTROLS: HEADER & SELECTORS (Top-Left) -->
    <header class="floating-overlay header-card">
      <h1>
        <!-- Map Pin SVG Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" 
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Route Finder
      </h1>
      <p class="subtitle">Shortest highway route across India using Dijkstra's Algorithm</p>

      <div class="route-selector-container">
        <!-- Start Node Field -->
        <div class="selector-field">
          <label for="source-btn">Start City</label>
          <button id="source-btn" class="select-btn" aria-haspopup="dialog" aria-expanded="false">
            <span>Choose Starting City</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
        </div>

        <!-- End Node Field -->
        <div class="selector-field">
          <label for="dest-btn">Destination City</label>
          <button id="dest-btn" class="select-btn" aria-haspopup="dialog" aria-expanded="false">
            <span>Choose Destination City</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Action Actions (Reset) -->
      <div class="control-row">
        <button id="reset-btn" class="btn-secondary" aria-label="Clear path and reset map view">
          <!-- Refresh SVG Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" 
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M16 3h5v5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 21H3v-5"/>
          </svg>
          Reset View
        </button>
      </div>
    </header>

    <!-- 3. FLOATING RESULTS PANEL (Bottom-Left) -->
    <section id="result-card" class="floating-overlay result-card" aria-label="Pathfinding calculation result">
      <div class="result-header">
        <h2 class="result-title">Shortest Highway Route</h2>
        <span id="distance-value" class="distance-badge">0 km</span>
      </div>
      <div class="route-timeline-container">
        <ol id="route-list" class="route-timeline"></ol>
      </div>
    </section>

    <!-- 4. MODAL SELECT DIALOG -->
    <div id="search-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modal-title">Select City</h3>
          <button id="modal-close" class="close-btn" aria-label="Close search window">
            <!-- Close Cross SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        
        <!-- Search Input Wrapper -->
        <div class="search-wrapper">
          <!-- Search Magnifier Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search by city name or state...">
        </div>

        <!-- Scrollable City List Container -->
        <div id="cities-list" class="cities-list-container"></div>
      </div>
    </div>

  </div>

  <!-- Leaflet.js JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
